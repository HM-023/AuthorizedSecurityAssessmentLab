<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc">
<title id="title">04 / ASSESSMENT FINDINGS</title><desc id="desc">Illustrative process from observation to remediation, retesting and a reviewed report. Only the presence of a retest note is enforced when resolving a finding; the app does not verify the evidence.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52626a" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="450" fill="#f5f3ed"/>
<path d="M40 86 H1080" stroke="#c7d0cd"/>
<text x="40" y="40" font-family="Consolas, monospace" font-size="16" font-weight="600" fill="#9a4a32" text-anchor="start">04 / ASSESSMENT FINDINGS</text>
<text x="40" y="69" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#182b35" text-anchor="start">A finding needs a fix, and the fix needs a retest.</text><rect x="40" y="147" width="245" height="148" rx="8" fill="white" stroke="#c7d0cd"/><text x="60" y="180" font-family="Consolas, monospace" font-size="14" font-weight="600" fill="#9a4a32" text-anchor="start">01</text><text x="60" y="211" font-family="Consolas, monospace" font-size="16" font-weight="600" fill="#182b35" text-anchor="start">OBSERVATION</text><text x="60" y="245" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#52626a" text-anchor="start">Describe the weakness</text><text x="60" y="272" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#52626a" text-anchor="start">Use an asset alias</text><path d="M285 221 H303" fill="none" stroke="#52626a" stroke-width="2" marker-end="url(#arrow)"/><rect x="305" y="147" width="245" height="148" rx="8" fill="white" stroke="#c7d0cd"/><text x="325" y="180" font-family="Consolas, monospace" font-size="14" font-weight="600" fill="#9a4a32" text-anchor="start">02</text><text x="325" y="211" font-family="Consolas, monospace" font-size="16" font-weight="600" fill="#182b35" text-anchor="start">REMEDIATION</text><text x="325" y="245" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#52626a" text-anchor="start">Record the proposed fix</text><text x="325" y="272" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#52626a" text-anchor="start">Track progress</text><path d="M550 221 H568" fill="none" stroke="#52626a" stroke-width="2" marker-end="url(#arrow)"/><rect x="570" y="147" width="245" height="148" rx="8" fill="white" stroke="#9a4a32"/><text x="590" y="180" font-family="Consolas, monospace" font-size="14" font-weight="600" fill="#9a4a32" text-anchor="start">03</text><text x="590" y="211" font-family="Consolas, monospace" font-size="16" font-weight="600" fill="#182b35" text-anchor="start">RETEST</text><text x="590" y="245" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#52626a" text-anchor="start">Record what was checked</text><text x="590" y="272" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#52626a" text-anchor="start">Review the result</text><path d="M815 221 H833" fill="none" stroke="#52626a" stroke-width="2" marker-end="url(#arrow)"/><rect x="835" y="147" width="245" height="148" rx="8" fill="white" stroke="#c7d0cd"/><text x="855" y="180" font-family="Consolas, monospace" font-size="14" font-weight="600" fill="#9a4a32" text-anchor="start">04</text><text x="855" y="211" font-family="Consolas, monospace" font-size="16" font-weight="600" fill="#182b35" text-anchor="start">REPORT</text><text x="855" y="245" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#52626a" text-anchor="start">Export Markdown / HTML</text><text x="855" y="272" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#52626a" text-anchor="start">Review before sharing</text><rect x="40" y="329" width="1040" height="62" rx="8" fill="#ece7dc" stroke="#ece7dc"/><text x="60" y="356" font-family="Consolas, monospace" font-size="14" font-weight="600" fill="#9a4a32" text-anchor="start">RESOLUTION GATE</text><text x="270" y="356" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#182b35" text-anchor="start">A resolved finding must have a retest note.</text><text x="270" y="379" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#52626a" text-anchor="start">The app checks that a note exists; a reviewer judges the evidence.</text><text x="40" y="424" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#52626a" text-anchor="start">Illustrative review process. Severity is manually assigned; no automated scanning is performed.</text>
</svg>
