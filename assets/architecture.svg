<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title"><title id="title">Authorized Security Assessment Lab architecture overview</title><rect width="1440" height="720" rx="22" fill="#0B1220"/><text x="50" y="66" fill="#F3F6FA" font-size="32" font-weight="700" text-anchor="start" font-family="DejaVu Sans, sans-serif">Assessment to remediation</text><text x="50" y="106" fill="#A6B6CB" font-size="18" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Authorized isolated training environments · methodology illustration, not new test evidence</text><path d="M 50 132 H 1390" fill="none" stroke="#293A50" stroke-width="2.5"/><path d="M 420 245 H 540 M 900 245 H 1020 M 1200 288 V 417 M 1020 460 H 900 M 540 460 H 420" fill="none" stroke="#FFC77A" stroke-width="2.5"/><rect x="60.0" y="202" width="360" height="86" rx="16" fill="#111E31" stroke="#293A50"/><circle cx="80.0" cy="226" r="4" fill="#FFC77A"/><text x="97.0" y="233" fill="#F3F6FA" font-size="20" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">01  Define scope</text><text x="80.0" y="264" fill="#A6B6CB" font-size="15" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Authorization and boundaries</text><rect x="540.0" y="202" width="360" height="86" rx="16" fill="#111E31" stroke="#293A50"/><circle cx="560.0" cy="226" r="4" fill="#FFC77A"/><text x="577.0" y="233" fill="#F3F6FA" font-size="20" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">02  Review assets</text><text x="560.0" y="264" fill="#A6B6CB" font-size="15" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Inventory and exposed services</text><rect x="1020.0" y="202" width="360" height="86" rx="16" fill="#111E31" stroke="#293A50"/><circle cx="1040.0" cy="226" r="4" fill="#FFC77A"/><text x="1057.0" y="233" fill="#F3F6FA" font-size="20" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">03  Verify carefully</text><text x="1040.0" y="264" fill="#A6B6CB" font-size="15" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Minimal checks inside the lab</text><rect x="1020.0" y="417" width="360" height="86" rx="16" fill="#111E31" stroke="#293A50"/><circle cx="1040.0" cy="441" r="4" fill="#FFC77A"/><text x="1057.0" y="448" fill="#F3F6FA" font-size="20" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">04  Record findings</text><text x="1040.0" y="479" fill="#A6B6CB" font-size="15" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Preconditions, impact and evidence</text><rect x="540.0" y="417" width="360" height="86" rx="16" fill="#111E31" stroke="#293A50"/><circle cx="560.0" cy="441" r="4" fill="#FFC77A"/><text x="577.0" y="448" fill="#F3F6FA" font-size="20" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">05  Recommend fixes</text><text x="560.0" y="479" fill="#A6B6CB" font-size="15" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Concrete defensive changes</text><rect x="60.0" y="417" width="360" height="86" rx="16" fill="#111E31" stroke="#293A50"/><circle cx="80.0" cy="441" r="4" fill="#FFC77A"/><text x="97.0" y="448" fill="#F3F6FA" font-size="20" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">06  Retest and close</text><text x="80.0" y="479" fill="#A6B6CB" font-size="15" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Record actual observed outcomes</text><text x="60" y="615" fill="#FFC77A" font-size="16" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">REFERENCE MATERIAL</text><text x="60" y="652" fill="#F3F6FA" font-size="23" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Scope document  /  Finding template  /  Defender retest checklist</text></svg>
